services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lexis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lexis"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lexis-postgres-data:/var/lib/postgresql/data

volumes:
  lexis-postgres-data:
